<div class="flex h-screen items-center justify-center">
    @if(!this.visible()){
    <div class="flex items-center justify-center mt-6">
        <img src="burro-corazon.png" alt="Burro enamorado" class="w-full h-48 sm:h-64 md:w-96 md:h-80 lg:w-[500] lg:h-[400] object-contain">
    </div>

    }@else{
        <div class="flex flex-col items-center justify-center gap-3">
            <img src="asset.png" alt="¿Me perdonas?">
            <div class="flex flex-col items-center md:flex-row mt-4 gap-3">
                <button (click)="meHazPerdonado()" class="flex items-center justify-center py-2 rounded-lg bg-green-500 text-white font-bold transition-all duration-200" [style.fontSize.px]="this.yesButtonSize()" [style.padding.px]="this.yesButtonSize() / 2">SI</button>
                <button (click)="hacerGrande()" class="flex items-center justify-center px-5 py-2 rounded-lg bg-red-500 text-white font-bold">NO</button>     
            </div>
        </div>
    }
</div>
